name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Demo closed loop
        run: python replanweaver.py demo --workers 4
      - name: Leaf-topology control
        run: python replanweaver.py run --tasks examples/leaf_tasks.json --workers 4
      - name: 70-dim selfcheck
        run: python strength70_selfcheck.py
